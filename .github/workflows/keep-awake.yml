# Keeps the free Supabase project from pausing between Sundays.
# Every day it reads one row from the song library.
# On the 1st of each month it also saves a tiny file to this repo, because
# GitHub turns off scheduled jobs in repos that have had no activity for 60 days.
#
# In GitHub this file must live at:  .github/workflows/keep-awake.yml
name: Keep song library awake

on:
  schedule:
    - cron: '17 11 * * *'   # every day at 11:17 UTC (7:17 AM Eastern in summer)
  workflow_dispatch:         # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read one song from Supabase
        env:
          SB_URL: https://lamithxecgiblsgvoszy.supabase.co
          SB_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxhbWl0aHhlY2dpYmxzZ3Zvc3p5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzNzcyNjQsImV4cCI6MjEwNzk1MzI2NH0.zSbJdlIuL3PHW0oeSLgc2Wk-uGAhNRYet8Y_wpPNsM4
        run: |
          curl -fsS "$SB_URL/rest/v1/songs?select=id&limit=1" \
            -H "apikey: $SB_KEY" -H "Authorization: Bearer $SB_KEY"
          echo
          echo "Song library is awake."

      - uses: actions/checkout@v4

      - name: Monthly heartbeat so GitHub keeps this job turned on
        run: |
          if [ "$(date -u +%d)" = "01" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            date -u > heartbeat.txt
            git config user.name "pad-click-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add heartbeat.txt
            git commit -m "Monthly heartbeat" || exit 0
            git push
          fi
